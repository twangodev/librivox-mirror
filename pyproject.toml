[project]
name = "librivox-mirror"
version = "0.0.0"
description = "Continuously mirror LibriVox audiobooks into ML-ready Hugging Face datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub[hf-xet]>=1.0",
    "httpx>=0.28",
    "mutagen>=1.47",
    "pyarrow>=21",
    "pydantic>=2.11",
    "rich>=14",
    "tenacity>=9.1",
    "typer>=0.17",
]

[project.scripts]
librivox-mirror = "librivox_mirror.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.138",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.12",
    "ty>=0.0.1a20",
]
integration = [
    "datasets>=4",
    "soundfile>=0.13",
    "webdataset>=1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires optional integration dependencies",
    "live: accesses live LibriVox, Internet Archive, or Hugging Face services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PTH", "RUF", "SIM", "UP", "W"]

[tool.coverage.run]
branch = true
source = ["librivox_mirror"]

[tool.coverage.report]
show_missing = true
skip_covered = true
