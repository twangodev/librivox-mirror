name: Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          python-version: ${{ steps.python.outputs.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff format --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          python-version: ${{ steps.python.outputs.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          python-version: ${{ steps.python.outputs.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --no-group integration
      - run: uv run --no-sync ty check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          python-version: ${{ steps.python.outputs.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --group integration
      - run: uv run --no-sync pytest --cov=librivox_mirror --cov-report=term-missing

  package:
    name: Package
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          python-version: ${{ steps.python.outputs.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - run: uv build --no-sources --out-dir "$RUNNER_TEMP/librivox-mirror-dist"
      - run: uv pip install --reinstall --no-deps "$RUNNER_TEMP"/librivox-mirror-dist/*.whl
      - run: uv run --no-sync librivox-mirror version

  release_please:
    name: Release Please
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          release-type: simple

  publish:
    name: Publish to PyPI
    if: needs.release_please.outputs.release_created == 'true'
    needs: release_please
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/librivox-mirror/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: uv.lock
      - env:
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
        run: uv version "$RELEASE_VERSION" --no-sync
      - run: uv build --no-sources
      - run: uv publish --trusted-publishing always
