name: Sync LibriVox

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      max_books:
        description: Maximum changed books to publish
        required: true
        default: 20
        type: number

permissions:
  contents: read

concurrency:
  group: librivox-hub-writes
  cancel-in-progress: false

jobs:
  sync:
    if: vars.HF_DATASET_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MAX_BOOKS: ${{ inputs.max_books || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-group dev --no-group integration
      - name: Publish daily changes
        run: >-
          uv run librivox-mirror sync
          --max-books "$MAX_BOOKS"
          --commit-size 1
          --jobs 2
          --state "$RUNNER_TEMP/librivox-mirror/state.sqlite3"
          --staging "$RUNNER_TEMP/librivox-mirror/staging"
