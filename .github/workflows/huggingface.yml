name: Hugging Face

on:
  schedule:
    - cron: "17 8 * * *"
    - cron: "43 9 1 * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Hub maintenance operation
        required: true
        default: sync
        type: choice
        options:
          - sync
          - reconcile
      max_books:
        description: Maximum changed books to publish
        required: true
        default: 20
        type: number

permissions:
  contents: read

concurrency:
  group: librivox-hub-writes
  cancel-in-progress: false

jobs:
  sync:
    name: Publish daily changes
    if: github.event.schedule == '17 8 * * *' || inputs.operation == 'sync'
    runs-on: ubuntu-latest
    environment: huggingface
    timeout-minutes: 330
    env:
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MAX_BOOKS: ${{ inputs.max_books || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: uv.lock
      - id: install
        run: uv sync --locked --no-group dev --no-group integration
      - run: uv run librivox-mirror sync --max-books "$MAX_BOOKS"
      - name: Report checkpoint status
        if: always() && steps.install.outcome == 'success'
        run: uv run librivox-mirror status

  reconcile:
    name: Reconcile changed books
    if: github.event.schedule == '43 9 1 * *' || inputs.operation == 'reconcile'
    runs-on: ubuntu-latest
    environment: huggingface
    timeout-minutes: 330
    env:
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MAX_BOOKS: ${{ inputs.max_books || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: uv.lock
      - id: install
        run: uv sync --locked --no-group dev --no-group integration
      - run: uv run librivox-mirror reconcile --max-books "$MAX_BOOKS" --jobs 2
      - name: Report checkpoint status
        if: always() && steps.install.outcome == 'success'
        run: uv run librivox-mirror status
