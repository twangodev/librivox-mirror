version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
